name: Daily Brief

# Este repositorio e vitrine: o workflow fica so como referencia, sem
# agendamento proprio. A versao que roda de verdade mora num repo privado -
# nao tem como rodar aqui sem voce cadastrar seus proprios secrets abaixo.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Reenviar mesmo se o brief de hoje ja foi enviado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar e enviar o brief
        env:
          # Provedor da curadoria: gemini (free tier) por padrao.
          # Para trocar para o Claude, mude para anthropic, descomente a linha
          # do anthropic em requirements.txt e cadastre ANTHROPIC_API_KEY.
          BRIEF_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
          # Id da SUA planilha de inscritos (opcional). Nao precisa ser secret -
          # so leitura publica e exposta - mas cadastre como secret se preferir.
          BRIEF_SUBSCRIBERS_SHEET_ID: ${{ secrets.BRIEF_SUBSCRIBERS_SHEET_ID }}
          BRIEF_FORCE: ${{ github.event.inputs.force }}
        run: python run_brief.py

      - name: Registrar o que saiu
        # Sem o commit, o seen.json volta ao estado do repo e o brief de amanha
        # repete as manchetes de hoje.
        if: always()
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "nada mudou em data/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "brief de $(date +%F)"
          git push
